# Infrastructure services shared across all environments.
# Extended by compose.{dev,prod,test}.yml via docker compose --file or include.

services:

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    environment:
      POSTGRES_PASSWORD: postiz-local-pwd
      POSTGRES_USER: postiz-local
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:0:5432
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-local -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    ports:
      - 127.0.0.1:0:6379
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - postiz-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1280M
        reservations:
          memory: 256M

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  temporal:
    container_name: temporal
    ports:
      - 127.0.0.1:0:7233
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - 127.0.0.1:0:8080
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  ferron:
    container_name: postiz-ferron
    image: ferronserver/ferron:2
    ports:
      - 127.0.0.1:0:80
      - 127.0.0.1:0:443
    environment:
      FERRON_DOMAIN: "${FERRON_DOMAIN:-*}"
    volumes:
      - ${FERRON_CONFIG:-./ferron/dev.kdl}:/etc/ferron.kdl:ro
      - ferron-acme:/var/cache/ferron-acme
    networks:
      - postiz-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  postiz-backend:
    container_name: postiz-backend
    environment:
      SERVICE: backend
    networks:
      - postiz-network
      - temporal-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postiz-frontend:
    container_name: postiz-frontend
    environment:
      SERVICE: frontend
    networks:
      - postiz-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postiz-orchestrator:
    container_name: postiz-orchestrator
    environment:
      SERVICE: orchestrator
      NODE_OPTIONS: "--max-old-space-size=256"
      ORCHESTRATOR_PORT: "3002"
    networks:
      - postiz-network
      - temporal-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  postiz-db-init:
    container_name: postiz-db-init
    environment:
      SERVICE: db-init
    depends_on:
      postiz-postgres:
        condition: service_healthy
    networks:
      - postiz-network
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres-volume:
    external: false
  ferron-acme:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
