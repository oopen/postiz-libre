# Production overrides — images from GHCR, restart always, secure limits.
# Usage: ENV=prod docker compose -f compose.common.yml -f compose.prod.yml up

include:
  - compose.common.yml

services:

  postiz-backend:
    depends_on:
      postiz-postgres:
        condition: service_started
      postiz-redis:
        condition: service_started
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
      PORT: "3000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postiz-frontend:
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
      FRONTEND_PORT: "4200"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postiz-orchestrator:
    depends_on:
      postiz-postgres:
        condition: service_started
      postiz-redis:
        condition: service_started
    restart: always

  postiz-db-init:
    depends_on:
      postiz-postgres:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure

  postiz-postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postiz-password}
      POSTGRES_USER: ${POSTGRES_USER:-postiz-user}
      POSTGRES_DB: ${POSTGRES_DB:-postiz-db-local}
