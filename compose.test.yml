# Test overrides — GHCR images, minimal limits, no restart.
# Usage: ENV=test docker compose -f compose.common.yml -f compose.test.yml up

include:
  - compose.common.yml

services:

  postiz-backend:
    image: ghcr.io/oopen/postiz-libre:latest
    pull_policy: always
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  postiz-frontend:
    image: ghcr.io/oopen/postiz-libre:latest
    pull_policy: always
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
