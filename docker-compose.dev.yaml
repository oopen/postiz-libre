# This docker-compose file is used for development purposes. It sets up the necessary services for the Postiz application.
# It is **not** intended for production use. For production, please refer to the official documentation.

services:

  postiz-postgres:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:17-alpine # 17.0
    container_name: postiz-postgres
    environment:
      POSTGRES_PASSWORD: postiz-local-pwd
      POSTGRES_USER: postiz-local
      POSTGRES_DB: postiz-db-local
      TEMPORAL_ADDRESS: "temporal:7233"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:0:5432
    networks:
      - postiz-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  postiz-redis:
    # ref: https://hub.docker.com/_/redis
    image: redis:7-alpine # 7.4.0
    container_name: postiz-redis
    ports:
      - 127.0.0.1:0:6379
    networks:
      - postiz-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  postiz-pg-admin:
    # ref: https://hub.docker.com/r/dpage/pgadmin4/tags
    image: dpage/pgadmin4:latest
    container_name: postiz-pg-admin
    ports:
      - 127.0.0.1:0:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - postiz-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  postiz-redisinsight:
    # ref: https://hub.docker.com/r/redis/redisinsight
    image: redis/redisinsight:latest
    container_name: postiz-redisinsight
    links:
      - postiz-redis
    ports:
      - '127.0.0.1:0:5540'
    volumes:
      - redisinsight:/data
    networks:
      - postiz-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  postiz-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    container_name: postiz-backend
    command:
      - |
        chown -R node:node /app/.pnpm-store /app/node_modules /app/apps/backend/node_modules 2>/dev/null || true
        su node --command 'pnpm install --frozen-lockfile'
        su node --command 'pnpm run dev:backend'
    volumes:
      - .:/app
      - be-pnpm-store:/app/.pnpm-store
      - be-node_modules:/app/node_modules
      - be-app-node_modules:/app/apps/backend/node_modules
    ports:
      - "127.0.0.1:0:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://postiz-local:postiz-local-pwd@postiz-postgres:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"
      TEMPORAL_ADDRESS: "temporal:7233"
      JWT_SECRET: "local-dev-jwt-secret-not-for-production-123456789"
      FRONTEND_URL: "http://localhost:4200"
      STORAGE_PROVIDER: "local"
      IS_GENERAL: "true"
      NODE_OPTIONS: "--max-old-space-size=3072"
      CHOKIDAR_USEPOLLING: "false"
    depends_on:
      postiz-postgres:
        condition: service_started
      postiz-redis:
        condition: service_started
    networks:
      - postiz-network
      - temporal-network
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 2048M

  postiz-frontend:
    profiles:
      - frontend
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    container_name: postiz-frontend
    command:
      - |
        chown -R node:node /app/.pnpm-store /app/node_modules /app/apps/frontend/node_modules /app/apps/frontend/.next 2>/dev/null || true
        su node --command 'pnpm install --frozen-lockfile'
        su node --command 'export $$(grep NEXT_PUBLIC_BACKEND_URL /app/apps/frontend/.env.local 2>/dev/null | xargs) && pnpm run dev:frontend'
    volumes:
      - .:/app
      - fe-pnpm-store:/app/.pnpm-store
      - fe-node_modules:/app/node_modules
      - fe-app-node_modules:/app/apps/frontend/node_modules
      - fe-next:/app/apps/frontend/.next
    ports:
      - "127.0.0.1:0:4200"
    environment:
      FRONTEND_PORT: "4200"
      BACKEND_INTERNAL_URL: "http://postiz-backend:3000"
      STORAGE_PROVIDER: "local"
      NODE_OPTIONS: "--max-old-space-size=1536"
      WATCHPACK_POLLING: "false"
    depends_on:
      postiz-backend:
        condition: service_started
    networks:
      - postiz-network
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1024M

  postiz-build:
    profiles:
      - build
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: build
    container_name: postiz-build
    command:
      - |
        chown -R node:node /app/.pnpm-store /app/node_modules /app/apps/backend/node_modules /app/apps/frontend/node_modules /app/apps/orchestrator/node_modules /app/apps/frontend/.next 2>/dev/null || true
        su node --command 'pnpm install --frozen-lockfile'
        su node --command 'pnpm run build'
    volumes:
      - .:/app
      - build-pnpm-store:/app/.pnpm-store
      - build-node_modules:/app/node_modules
      - build-backend-node_modules:/app/apps/backend/node_modules
      - build-frontend-node_modules:/app/apps/frontend/node_modules
      - build-orchestrator-node_modules:/app/apps/orchestrator/node_modules
      - build-next:/app/apps/frontend/.next
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 2048M

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  temporal:
    container_name: temporal
    ports:
      - "127.0.0.1:0:7233"
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - "127.0.0.1:0:8080"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  be-pnpm-store:
  be-node_modules:
  be-app-node_modules:
  fe-pnpm-store:
  fe-node_modules:
  fe-app-node_modules:
  fe-next:
  build-pnpm-store:
  build-node_modules:
  build-backend-node_modules:
  build-frontend-node_modules:
  build-orchestrator-node_modules:
  build-next:
  redisinsight:
  postgres-volume:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
